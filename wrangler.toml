name = "shemsi-ai"
main = "src/index.ts"
compatibility_date = "2026-11-07"
workers_dev = true

[vars]
DEFAULT_MODEL = "@cf/meta/llama-3.1-8b-instruct"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "telegram-ai-assistant"
database_id = "2fe19a33-5da9-4e44-a5d9-32718ae03af3"
migrations_dir = "migrations"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
