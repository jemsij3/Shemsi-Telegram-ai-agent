name = "shemsi-ai"
main = "src/index.ts"
compatibility_date = "2026-11-07"
workers_dev = true

[vars]
DEFAULT_MODEL = "@cf/meta/llama-3.1-8b-instruct"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "shemsi-ai-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
